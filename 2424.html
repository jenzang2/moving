<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이사 준비 견적 비교</title>
<style>
  :root { --base: 13px; --vw: 12rem; }
  html { font-size: var(--base); }
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; margin: 0; background: #f4f5f7; color: #222; font-size: 1rem; }
  header { background: #2d3e50; color: #fff; padding: 10px 22px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.38rem; flex: 1; white-space: nowrap; }
  header .user { font-size: .92rem; opacity: .85; }
  header .sync { font-size: .85rem; background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 10px; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
  .form-grid { display: grid; grid-template-columns: 7rem 10rem 10.5rem 9.5rem 11.5rem 13rem 1fr; gap: 8px; }
  .form-grid label, .form-grid .flabel { font-size: .85rem; color: #666; display: block; margin-bottom: 3px; white-space: nowrap; }
  .form-grid .rent-opt { display: inline-flex; align-items: center; gap: 3px; margin: 0 0 0 6px; color: #1a5fd0; cursor: pointer; }
  input, select { width: 100%; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; font-family: inherit; }
  input[type=checkbox] { width: auto; padding: 0; margin: 0; cursor: pointer; }
  button, .btn { padding: 7px 13px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-family: inherit; text-decoration: none; display: inline-block; }
  .btn-primary { background: #2d7ff9; color: #fff; }
  .btn-gray { background: #e3e6ea; color: #333; }
  .btn-red { background: #fde8e8; color: #c0392b; }
  .btn-call { background: #e3f6ea; color: #1e8449; }
  .btn-open { background: #e8f0fe; color: #1a5fd0; }
  .btn-small { padding: 4px 8px; font-size: .85rem; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 10rem; background: #f8f9fb; border-radius: 8px; padding: 10px 12px; }
  .stat .label { font-size: .85rem; color: #777; }
  .stat .value { font-size: 1.38rem; font-weight: bold; margin-top: 4px; }
  .stat.total .value { color: #2d7ff9; }
  .stat.rent .value { color: #1a5fd0; }
  .sel-title { font-size: .92rem; color: #777; margin: 14px 0 6px; }
  .sel-empty { font-size: .92rem; color: #aaa; padding: 10px 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar select, .toolbar input { width: auto; }
  .group { border: 1px solid #e3e6ea; border-radius: 8px; margin-bottom: 12px; overflow: hidden; transition: opacity .15s; }
  .group.dragging { opacity: .35; }
  .group.drop-before { box-shadow: 0 -4px 0 #2d7ff9; }
  .group.drop-after { box-shadow: 0 4px 0 #2d7ff9; }
  .group-head { background: #f0f3f7; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; cursor: grab; user-select: none; }
  .group-head:active { cursor: grabbing; }
  .group-head .title { font-weight: bold; font-size: 1.08rem; }
  .group-head .meta { color: #888; font-size: .92rem; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .multi-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; color: #555; background: #fff; border: 1px solid #d8dde3; padding: 3px 9px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .multi-toggle.on { border-color: #2d7ff9; color: #1a5fd0; background: #eef5ff; }
  .group-foot { border-top: 1px solid #eee; }
  .add-row-btn { width: 100%; background: none; color: #2d7ff9; font-size: .92rem; padding: 7px 12px; border-radius: 0; text-align: left; }
  .add-row-btn:hover { background: #f3f8ff; }
  .drag-handle { color: #aab; font-size: 1.15rem; margin-right: 8px; }
  .badge { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 10px; margin-right: 6px; color: #fff; white-space: nowrap; }
  .b-시공 { background: #e67e22; } .b-구매 { background: #27ae60; } .b-서비스 { background: #8e44ad; } .b-기타 { background: #7f8c8d; }
  .status-done { color: #27ae60; font-size: .92rem; font-weight: bold; white-space: nowrap; }
  .status-wait { color: #e74c3c; font-size: .92rem; font-weight: bold; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 1rem; table-layout: fixed; }
  th, td { padding: 7px 9px; border-top: 1px solid #eee; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
  th { font-size: .85rem; color: #777; font-weight: normal; background: #fafbfc; white-space: nowrap; }
  td.price, th.price { text-align: right; white-space: nowrap; }
  td.memo { white-space: pre-wrap; color: #444; }
  td.btns, td.nowrap { white-space: nowrap; }
  td.btns { text-align: right; }
  td.vendor { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.ctr, th.ctr { text-align: center; }
  .phone { margin-right: 6px; }
  tr.selected { background: #eaf3ff; }
  tr.editing { background: #fffbe6; }
  tr.editing input:not([type=checkbox]) { padding: 5px 6px; font-size: .92rem; }
  .rent-cb { width: 17px !important; height: 17px; }
  .cheap { display: inline-block; font-size: .8rem; color: #1e8449; background: #e3f6ea; padding: 1px 6px; border-radius: 8px; margin-right: 6px; }
  .rent-tag { display: inline-block; font-size: .8rem; color: #1a5fd0; background: #e8f0fe; padding: 1px 6px; border-radius: 8px; margin-right: 6px; }
  .empty { text-align: center; color: #999; padding: 30px; }
  .sel-table td { background: #f8fbff; }
  .sel-table tr.sel-first td { border-top: 1px solid #dfe5ec; }
  .sel-table tr.sel-cont td { border-top: 1px dashed #e6eaf0; }
  .sel-table tr.sel-cont td:first-child { border-top: none; }
  .sel-count { color: #888; font-size: .85rem; margin-left: 4px; }
  #gate { position: fixed; inset: 0; background: #f4f5f7; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #gate .box { background: #fff; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.1); max-width: 360px; }
  #gate .msg { color: #c0392b; font-size: .92rem; margin-top: 12px; min-height: 18px; }
  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #2d3e50; color: #fff; padding: 9px 18px; border-radius: 20px; font-size: 1rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }

  /* ===== 탭 + 보기 조절 ===== */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .tab { flex: none; background: #e3e6ea; color: #555; font-weight: bold; padding: 9px 17px; border-radius: 20px; }
  .tab.active { background: #2d3e50; color: #fff; }
  .view-ctl { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: .85rem; color: #666; }
  .view-ctl .sep { width: 10px; }
  .view-ctl button { padding: 4px 9px; font-size: .85rem; background: #fff; border: 1px solid #d8dde3; color: #333; }

  /* ===== 살 것 메모 ===== */
  .shop-add { display: flex; gap: 8px; }
  .shop-add input { flex: 1; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(23rem, 1fr)); gap: 14px; }
  .shop-grid .card { margin-bottom: 0; }
  .store-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .store-name { flex: 1; min-width: 0; border: none; font-size: 1.15rem; font-weight: bold; padding: 4px 6px; background: transparent; }
  .store-name:focus, .shop-item .txt:focus { background: #fffbe6; outline: 1px solid #f0d878; }
  .store-count { font-size: .85rem; color: #888; white-space: nowrap; }
  .shop-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid #f0f0f0; }
  .shop-item input[type=checkbox] { width: 19px; height: 19px; flex: none; margin: 0 2px; }
  .shop-item .txt { flex: 1; min-width: 0; border: none; padding: 6px; background: transparent; }
  .shop-item.done .txt { text-decoration: line-through; color: #aaa; }
  .x-btn { background: none; color: #bbb; padding: 4px 8px; font-size: 1.3rem; line-height: 1; }
  .x-btn:hover { color: #c0392b; }
  .shop-empty { font-size: .92rem; color: #aaa; padding: 8px 2px; border-top: 1px solid #f0f0f0; }
  .add-line { display: flex; gap: 6px; margin-top: 10px; }
  .add-line input { flex: 1; min-width: 0; }
  .link-btn { background: none; color: #888; font-size: .85rem; padding: 6px 2px 0; text-decoration: underline; }

  /* ===== 모바일 보정 (표 안에서 손가락으로 가로 스크롤) ===== */
  .mx-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .mx-scroll > table { min-width: calc(var(--vw) + 60rem); }
  @media (max-width: 900px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) {
    header { row-gap: 8px; }
    header h1 { flex: 1 0 100%; }
    main { padding: 12px; }
    .tab { flex: 1; padding: 9px 8px; }
    .view-ctl { margin-left: 0; width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2 style="margin-top:0">🏠 이사 준비 견적 비교표</h2>
  <p style="color:#666">등록된 구글 계정으로 로그인해 주세요.</p>
  <button class="btn-primary" id="btnLogin">구글로 로그인</button>
  <div class="msg" id="gateMsg"></div>
</div></div>

<header>
  <h1>🏠 이사 준비 견적 비교표</h1>
  <span class="sync" id="syncState">연결 중…</span>
  <span class="user" id="userEmail"></span>
  <button class="btn-small btn-gray" id="btnLogout">로그아웃</button>
</header>
<main>

  <div class="tabs">
    <button class="tab" data-tab="quote">📋 견적 비교</button>
    <button class="tab" data-tab="shop" id="tabShopBtn">🛒 살 것 메모</button>
    <div class="view-ctl">
      <span>글자</span>
      <button data-view="fs" data-d="-1" title="글자 작게">가−</button>
      <button data-view="fs" data-d="1" title="글자 크게">가+</button>
      <span class="sep"></span>
      <span>업체칸</span>
      <button data-view="vw" data-d="-1" title="업체칸 좁게">◀</button>
      <button data-view="vw" data-d="1" title="업체칸 넓게">▶</button>
    </div>
  </div>

  <!-- ===================== 탭1: 견적 비교 ===================== -->
  <div id="tab-quote">
    <div class="card">
      <h2>새 항목 / 후보 추가</h2>
      <div class="form-grid">
        <div><label>구분</label>
          <select id="fCat"><option>시공</option><option>구매</option><option>서비스</option><option>기타</option></select></div>
        <div><label>항목 *</label><input id="fName" list="nameList" placeholder="예: 줄눈"></div>
        <div><label>업체·제품 *</label><input id="fVendor" placeholder="예: A줄눈"></div>
        <div><div class="flabel">금액 (원)<label class="rent-opt" id="fRentWrap"><input type="checkbox" id="fRental"> 렌탈(월)</label></div><input id="fPrice" placeholder="600000"></div>
        <div><label>연락처</label><input id="fContact" placeholder="010-0000-0000" inputmode="tel"></div>
        <div><label>링크</label><input id="fLink" placeholder="https://..."></div>
        <div><label>비고</label><input id="fMemo" placeholder="예: 케라폭시, 욕실2+현관, AS 2년"></div>
      </div>
      <datalist id="nameList"></datalist>
      <div class="actions"><button class="btn-primary" id="btnAdd">추가</button></div>
    </div>

    <div class="card">
      <h2>요약</h2>
      <div class="summary" id="summary"></div>
      <div class="sel-title">선택한 후보</div>
      <div id="selectedList"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="filterCat"><option value="">전체 구분</option><option>시공</option><option>구매</option><option>서비스</option><option>기타</option></select>
        <select id="filterStatus"><option value="">전체 상태</option><option value="wait">미결정만</option><option value="done">결정완료만</option></select>
        <input id="search" placeholder="검색 (항목, 업체, 비고)">
        <span style="flex:1"></span>
        <button class="btn-gray" id="btnCsv">엑셀(CSV) 내보내기</button>
        <button class="btn-gray" id="btnBackup">백업 저장</button>
        <button class="btn-gray" id="btnRestore">백업 불러오기</button>
        <input type="file" id="fileInput" accept=".json" style="display:none">
      </div>
      <div id="list"></div>
    </div>
  </div>

  <!-- ===================== 탭2: 살 것 메모 ===================== -->
  <div id="tab-shop" style="display:none">
    <div class="card">
      <h2>가게 / 장소 추가</h2>
      <div class="shop-add">
        <input id="sName" placeholder="예: 코스트코, 다이소, 이케아">
        <button class="btn-primary" id="btnAddStore">추가</button>
      </div>
    </div>
    <div id="shopList" class="shop-grid"></div>
  </div>

</main>
<div id="toast"></div>

<script>
const CATS = ['시공','구매','서비스','기타'];
const NEW_ID = '__new__';
const $ = id => document.getElementById(id);

// ---------- 보기 설정 (글자 크기 / 업체칸 폭) : 기기마다 따로 저장 ----------
const VIEW_KEY = 'moving-view';
let view = { fs: 13, vw: 12 };
try { Object.assign(view, JSON.parse(localStorage.getItem(VIEW_KEY) || '{}')); } catch {}
function applyView() {
  const r = document.documentElement.style;
  r.setProperty('--base', view.fs + 'px');
  r.setProperty('--vw', view.vw + 'rem');
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {}
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  const d = Number(b.dataset.d);
  if (b.dataset.view === 'fs') { view.fs = Math.min(17, Math.max(11, view.fs + d)); toast(`글자 크기 ${view.fs}`); }
  else { view.vw = Math.min(30, Math.max(8, view.vw + d * 2)); toast(`업체칸 폭 ${view.vw}`); }
  applyView();
});
applyView();

// ---------- 전화번호 / 링크 ----------
function formatPhone(v) {
  v = String(v ?? '');
  if (/[^\d\-\s()+.]/.test(v)) return v;
  const d = v.replace(/\D/g, '');
  if (!d) return v.trim();
  if (/^1[5-9]\d/.test(d)) return d.length <= 4 ? d : d.slice(0, 4) + '-' + d.slice(4, 8);
  if (d[0] !== '0') return v;
  const a = d.startsWith('02') ? 2 : /^050/.test(d) ? 4 : 3;
  const area = d.slice(0, a), rest = d.slice(a, a + 8);
  if (!rest) return area;
  if (rest.length <= 3) return area + '-' + rest;
  const mid = rest.length <= 7 ? 3 : 4;
  return area + '-' + rest.slice(0, mid) + '-' + rest.slice(mid);
}
function isCallable(c) { return !/[^\d\-\s()+.]/.test(c) && c.replace(/\D/g, '').length >= 8; }
function normalizeLink(l) {
  l = String(l ?? '').trim();
  if (!l) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(l)) l = 'https://' + l;
  return l;
}
function bindPhoneInput(el) {
  el.addEventListener('input', () => { if (el.selectionStart === el.value.length) el.value = formatPhone(el.value); });
  el.addEventListener('blur', () => el.value = formatPhone(el.value));
}

// ---------- 공통 ----------
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parsePrice(v) { return Number(String(v).replace(/[^0-9]/g, '')) || 0; }
function newId() { return Date.now() + '' + Math.random().toString().slice(2, 8); }
function toArr(d) { return Array.isArray(d) ? d : (d ? Object.values(d) : []); }

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('링크를 복사했어요');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });

// ---------- 탭 ----------
function showTab(t) {
  ['quote', 'shop'].forEach(k => {
    $('tab-' + k).style.display = k === t ? '' : 'none';
    document.querySelector(`[data-tab="${k}"]`).classList.toggle('active', k === t);
  });
  try { localStorage.setItem('moving-tab', t); } catch {}
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ===================================================================
//  탭1: 견적 비교
// ===================================================================
function migrate(arr) {
  return toArr(arr).filter(Boolean).map(i => {
    let contact = i.contact || '', link = i.link;
    if (link === undefined) { link = ''; if (/^https?:\/\//.test(contact)) { link = contact; contact = ''; } }
    return {
      id: String(i.id || Date.now() + '' + Math.random()), selected: !!i.selected, multi: !!i.multi, rental: !!i.rental,
      cat: i.cat || '기타', name: i.name || '', vendor: i.vendor || '', price: Number(i.price) || 0,
      contact: formatPhone(contact), link: link || '', memo: i.memo || ''
    };
  });
}
let items = [];
let editingId = null, addingName = null, dragName = null, pendingRemote = false, noDrag = false;

window.applyRemote = data => {
  items = migrate(data);
  if (editingId) { pendingRemote = true; return; }
  render();
};
function persist() {
  render();
  if (window.cloudSave) window.cloudSave(items);
  else alert('아직 서버에 연결되지 않았어요. 잠시 후 다시 시도해 주세요.');
}
function isMulti(name) { return items.some(i => i.name === name && i.multi); }
function isRent(i) { return !!i.rental && i.cat === '구매'; }
function priceText(i) { return i.price ? (isRent(i) ? '월 ' : '') + won(i.price) : '-'; }
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => setTimeout(() => noDrag = false, 0)));

function contactCell(c) {
  if (!c) return '';
  return `<span class="phone">${esc(c)}</span>` +
    (isCallable(c) ? `<a class="btn btn-small btn-call" href="tel:${c.replace(/\D/g, '')}">전화</a>` : '');
}
function linkCell(l) {
  if (!l) return '';
  if (!/^https?:\/\//i.test(l)) return esc(l);
  return `<a class="btn btn-small btn-open" href="${esc(l)}" target="_blank" rel="noopener" title="${esc(l)}">열기</a>
    <button class="btn-small btn-gray" data-copy="${esc(l)}">복사</button>`;
}

// 구매 항목이면 '렌탈' 칸이 하나 더 생김
function cols(buy) {
  return `<colgroup><col style="width:3.2rem"><col style="width:var(--vw)">${buy ? '<col style="width:3.6rem">' : ''}<col style="width:11rem"><col style="width:13.5rem"><col style="width:8.5rem"><col><col style="width:12.5rem"></colgroup>`;
}

function groupItems(list) {
  const map = new Map();
  list.forEach(it => { if (!map.has(it.name)) map.set(it.name, []); map.get(it.name).push(it); });
  return map;
}

// 위쪽 입력칸: 구분이 '구매'일 때만 렌탈 체크박스 보이기
function syncRentOpt() {
  const ex = items.find(i => i.name === $('fName').value.trim());
  const cat = ex ? ex.cat : $('fCat').value;
  $('fRentWrap').style.display = cat === '구매' ? '' : 'none';
}
$('fCat').addEventListener('change', syncRentOpt);
$('fName').addEventListener('input', syncRentOpt);

bindPhoneInput($('fContact'));
$('btnAdd').onclick = () => {
  const data = {
    cat: $('fCat').value, name: $('fName').value.trim(), vendor: $('fVendor').value.trim(),
    price: parsePrice($('fPrice').value), contact: formatPhone($('fContact').value.trim()),
    link: normalizeLink($('fLink').value), memo: $('fMemo').value.trim()
  };
  if (!data.name || !data.vendor) { alert('항목이랑 업체·제품은 꼭 입력해주세요.'); return; }
  const existing = items.find(i => i.name === data.name);
  if (existing) data.cat = existing.cat;
  data.rental = data.cat === '구매' && $('fRental').checked;
  items.push({ id: newId(), selected: false, multi: isMulti(data.name), ...data });
  ['fVendor','fPrice','fContact','fLink','fMemo'].forEach(id => $(id).value = '');
  $('fRental').checked = false;
  $('fVendor').focus();
  persist();
};
document.querySelectorAll('.form-grid input').forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') $('btnAdd').click(); }));

function startEdit(id) { editingId = id; addingName = null; render(); }
function startAdd(name) { editingId = NEW_ID; addingName = name; render(); }
function cancelEdit() { editingId = null; addingName = null; render(); }
function saveEdit() {
  const vendor = $('eVendor').value.trim();
  if (!vendor) { alert('업체·제품은 비워둘 수 없어요.'); $('eVendor').focus(); return; }
  const data = {
    vendor, price: parsePrice($('ePrice').value), contact: formatPhone($('eContact').value.trim()),
    link: normalizeLink($('eLink').value), memo: $('eMemo').value.trim(),
    rental: $('eRental') ? $('eRental').checked : false
  };
  if (editingId === NEW_ID) {
    const group = items.filter(i => i.name === addingName);
    if (!group.length) { alert('그 사이에 이 항목이 삭제됐어요.'); cancelEdit(); return; }
    const lastIdx = items.lastIndexOf(group[group.length - 1]);
    items.splice(lastIdx + 1, 0, { id: newId(), selected: false, multi: isMulti(addingName), cat: group[0].cat, name: addingName, ...data });
  } else {
    const it = items.find(i => i.id === editingId);
    if (!it) { alert('그 사이에 이 후보가 삭제됐어요.'); cancelEdit(); return; }
    Object.assign(it, data);
  }
  editingId = null; addingName = null;
  persist();
}
function deleteItem(id) {
  if (!confirm('이 후보를 삭제할까요?')) return;
  items = items.filter(i => i.id !== id);
  if (editingId === id) editingId = null;
  persist();
}
function toggleSelect(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  const willSelect = !it.selected;
  if (!isMulti(it.name)) items.forEach(i => { if (i.name === it.name) i.selected = false; });
  it.selected = willSelect;
  persist();
}
function unselect(id) { const it = items.find(i => i.id === id); if (it) { it.selected = false; persist(); } }
function toggleRental(id, on) { const it = items.find(i => i.id === id); if (it) { it.rental = on; persist(); } }

function toggleMulti(name, on) {
  const list = items.filter(i => i.name === name);
  if (!list.length) return;
  if (!on) {
    const sel = list.filter(i => i.selected);
    if (sel.length > 1) {
      if (!confirm(`'${name}'에 선택된 후보가 ${sel.length}개예요.\n맨 위 하나만 남기고 나머지는 선택해제할까요?`)) { render(); return; }
      sel.slice(1).forEach(i => i.selected = false);
    }
  }
  list.forEach(i => i.multi = on);
  persist();
}

function editRow(no, it, buy) {
  return `<tr class="editing">
    <td>${no}</td>
    <td><input id="eVendor" value="${esc(it.vendor)}" placeholder="업체·제품"></td>
    ${buy ? `<td class="ctr"><input type="checkbox" id="eRental" class="rent-cb" ${it.rental ? 'checked' : ''} title="렌탈(월 금액)"></td>` : ''}
    <td><input id="ePrice" value="${it.price ? it.price.toLocaleString('ko-KR') : ''}" placeholder="${buy ? '금액 (렌탈이면 월)' : '금액'}" style="text-align:right"></td>
    <td><input id="eContact" value="${esc(it.contact)}" placeholder="연락처" inputmode="tel"></td>
    <td><input id="eLink" value="${esc(it.link)}" placeholder="링크"></td>
    <td><input id="eMemo" value="${esc(it.memo)}" placeholder="비고"></td>
    <td class="btns">
      <button class="btn-small btn-primary" onclick="saveEdit()">저장</button>
      <button class="btn-small btn-gray" onclick="cancelEdit()">취소</button>
    </td></tr>`;
}

function moveGroup(from, to, after) {
  if (from === to) return;
  const moving = items.filter(i => i.name === from);
  const rest = items.filter(i => i.name !== from);
  let idx;
  if (after) {
    idx = rest.length;
    for (let k = rest.length - 1; k >= 0; k--) { if (rest[k].name === to) { idx = k + 1; break; } }
  } else {
    idx = rest.findIndex(i => i.name === to);
    if (idx < 0) idx = 0;
  }
  rest.splice(idx, 0, ...moving);
  items = rest;
  persist();
}
function clearDrop() { document.querySelectorAll('.group').forEach(g => g.classList.remove('drop-before', 'drop-after')); }
function bindDrag() {
  document.querySelectorAll('.group').forEach(g => {
    const head = g.querySelector('.group-head');
    head.addEventListener('dragstart', e => {
      if (noDrag) { e.preventDefault(); noDrag = false; return; }
      dragName = g.dataset.name;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragName);
      e.dataTransfer.setDragImage(g, 30, 20);
      setTimeout(() => g.classList.add('dragging'), 0);
    });
    head.addEventListener('dragend', () => { dragName = null; clearDrop(); g.classList.remove('dragging'); });
    g.addEventListener('dragover', e => {
      if (!dragName || g.dataset.name === dragName) return;
      e.preventDefault();
      const r = g.getBoundingClientRect();
      clearDrop();
      g.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
    });
    g.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragName || g.dataset.name === dragName) return;
      const after = g.classList.contains('drop-after');
      const from = dragName; dragName = null;
      moveGroup(from, g.dataset.name, after);
    });
  });
}

function render() {
  pendingRemote = false;
  $('nameList').innerHTML = [...new Set(items.map(i => i.name))].map(n => `<option value="${esc(n)}">`).join('');
  syncRentOpt();

  const groups = groupItems(items);
  const groupOrder = new Map([...groups.keys()].map((n, i) => [n, i]));
  const posInGroup = new Map();
  groups.forEach(list => list.forEach((it, i) => posInGroup.set(it.id, i)));

  const selected = items.filter(i => i.selected).sort((a, b) =>
    (CATS.indexOf(a.cat) - CATS.indexOf(b.cat)) ||
    (groupOrder.get(a.name) - groupOrder.get(b.name)) ||
    (posInGroup.get(a.id) - posInGroup.get(b.id)));
  const oneTime = selected.filter(i => !isRent(i));
  const total = oneTime.reduce((s, i) => s + i.price, 0);
  const rentTotal = selected.filter(isRent).reduce((s, i) => s + i.price, 0);
  const byCat = {};
  oneTime.forEach(i => byCat[i.cat] = (byCat[i.cat] || 0) + i.price);
  const waitCount = [...groups.values()].filter(g => !g.some(i => i.selected)).length;
  let html = `<div class="stat total"><div class="label">선택한 후보 총액</div><div class="value">${won(total)}</div></div>`;
  if (rentTotal) html += `<div class="stat rent"><div class="label">월 렌탈료 (총액에서 제외)</div><div class="value">월 ${won(rentTotal)}</div></div>`;
  CATS.forEach(c => { if (byCat[c]) html += `<div class="stat"><div class="label">${c}</div><div class="value">${won(byCat[c])}</div></div>`; });
  html += `<div class="stat"><div class="label">미결정 항목</div><div class="value" style="color:${waitCount ? '#e74c3c' : '#27ae60'}">${waitCount}개 / 총 ${groups.size}개</div></div>`;
  $('summary').innerHTML = html;

  if (!selected.length) {
    $('selectedList').innerHTML = `<div class="sel-empty">아직 선택한 후보가 없어요. 아래 목록에서 '선택'을 눌러보세요.</div>`;
  } else {
    const selCount = {};
    selected.forEach(i => selCount[i.name] = (selCount[i.name] || 0) + 1);
    let s = `<div class="mx-scroll"><table class="sel-table"><colgroup><col style="width:12rem"><col style="width:var(--vw)"><col style="width:12rem"><col style="width:13.5rem"><col><col style="width:6.5rem"></colgroup>
      <tr><th>항목</th><th>업체·제품</th><th class="price">금액</th><th>연락처</th><th>비고</th><th></th></tr>`;
    let prev = null;
    selected.forEach(it => {
      const first = it.name !== prev; prev = it.name;
      const nameCell = first
        ? `<span class="badge b-${esc(it.cat)}">${esc(it.cat)}</span>${esc(it.name)}${selCount[it.name] > 1 ? `<span class="sel-count">${selCount[it.name]}개</span>` : ''}`
        : '';
      s += `<tr class="${first ? 'sel-first' : 'sel-cont'}"><td>${nameCell}</td>
        <td class="vendor" title="${esc(it.vendor)}">${esc(it.vendor)}</td>
        <td class="price">${isRent(it) ? '<span class="rent-tag">렌탈</span>' : ''}${priceText(it)}</td>
        <td class="nowrap">${contactCell(it.contact)}</td>
        <td class="memo">${esc(it.memo)}</td>
        <td class="btns"><button class="btn-small btn-gray" onclick="unselect('${it.id}')">선택해제</button></td></tr>`;
    });
    $('selectedList').innerHTML = s + '</table></div>';
  }

  const fc = $('filterCat').value, fs = $('filterStatus').value, q = $('search').value.trim().toLowerCase();
  let out = '';
  groups.forEach((list, name) => {
    const selN = list.filter(i => i.selected).length;
    const done = selN > 0;
    const multi = list.some(i => i.multi);
    const buy = list[0].cat === '구매';
    if (fc && !list.some(i => i.cat === fc)) return;
    if (fs === 'wait' && done) return;
    if (fs === 'done' && !done) return;
    if (q && !list.some(i => [i.name, i.vendor, i.memo, i.contact, i.link].join(' ').toLowerCase().includes(q))) return;

    // 일시불과 렌탈(월)은 따로 최저가 비교
    const oneP = list.filter(i => !isRent(i)).map(i => i.price).filter(p => p > 0);
    const rentP = list.filter(isRent).map(i => i.price).filter(p => p > 0);
    const minOne = oneP.length ? Math.min(...oneP) : null;
    const minRent = rentP.length ? Math.min(...rentP) : null;
    const minText = (minOne !== null ? ' · 최저 ' + won(minOne) : '') + (minRent !== null ? ' · 렌탈 최저 월 ' + won(minRent) : '');
    const isAddingHere = editingId === NEW_ID && addingName === name;
    const statusText = selN === 0 ? '미결정' : selN === 1 ? '✔ 결정완료' : `✔ 선택 ${selN}개`;
    out += `<div class="group" data-name="${esc(name)}">
      <div class="group-head" draggable="true" title="드래그해서 순서 변경">
        <div><span class="drag-handle">⠿</span><span class="badge b-${esc(list[0].cat)}">${esc(list[0].cat)}</span><span class="title">${esc(name)}</span>
          <span class="meta"> · 후보 ${list.length}개${minText}</span></div>
        <div class="head-right">
          <div class="${done ? 'status-done' : 'status-wait'}">${statusText}</div>
          <label class="multi-toggle ${multi ? 'on' : ''}" title="여러 후보를 함께 선택할 수 있어요 (예: 방마다 다른 커튼)">
            <input type="checkbox" data-multi="${esc(name)}" ${multi ? 'checked' : ''}> 중복선택
          </label>
        </div>
      </div>
      <div class="mx-scroll"><table>${cols(buy)}<tr><th>후보</th><th>업체·제품</th>${buy ? '<th class="ctr">렌탈</th>' : ''}<th class="price">금액</th><th>연락처</th><th>링크</th><th>비고</th><th></th></tr>`;
    list.forEach((it, idx) => {
      if (it.id === editingId) { out += editRow(idx + 1, it, buy); return; }
      const r = isRent(it);
      const isMin = r ? (minRent !== null && it.price === minRent && rentP.length > 1)
                      : (minOne !== null && it.price === minOne && oneP.length > 1);
      const selLabel = multi ? (it.selected ? '☑ 선택됨' : '☐ 선택') : (it.selected ? '선택됨' : '선택');
      out += `<tr class="${it.selected ? 'selected' : ''}">
        <td>${idx + 1}</td>
        <td class="vendor" title="${esc(it.vendor)}">${it.selected ? '⭐ ' : ''}${esc(it.vendor)}</td>
        ${buy ? `<td class="ctr"><input type="checkbox" class="rent-cb" data-rent="${it.id}" ${it.rental ? 'checked' : ''} title="렌탈(월 금액)"></td>` : ''}
        <td class="price">${isMin ? '<span class="cheap">최저</span>' : ''}${priceText(it)}</td>
        <td class="nowrap">${contactCell(it.contact)}</td>
        <td class="nowrap">${linkCell(it.link)}</td>
        <td class="memo">${esc(it.memo)}</td>
        <td class="btns">
          <button class="btn-small ${it.selected ? 'btn-primary' : 'btn-gray'}" onclick="toggleSelect('${it.id}')">${selLabel}</button>
          <button class="btn-small btn-gray" onclick="startEdit('${it.id}')">수정</button>
          <button class="btn-small btn-red" onclick="deleteItem('${it.id}')">삭제</button>
        </td></tr>`;
    });
    if (isAddingHere) out += editRow(list.length + 1, { vendor: '', price: 0, contact: '', link: '', memo: '', rental: false }, buy);
    out += `</table></div>`;
    if (!isAddingHere) out += `<div class="group-foot"><button class="add-row-btn" data-add="${esc(name)}">+ ${esc(name)} 후보 추가</button></div>`;
    out += `</div>`;
  });
  $('list').innerHTML = out || `<div class="empty">${items.length ? '조건에 맞는 항목이 없어요.' : '아직 후보가 없어요. 위에서 추가해보세요!'}</div>`;

  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => startAdd(b.dataset.add));
  document.querySelectorAll('[data-multi]').forEach(cb => cb.onchange = () => toggleMulti(cb.dataset.multi, cb.checked));
  document.querySelectorAll('[data-rent]').forEach(cb => cb.onchange = () => toggleRental(cb.dataset.rent, cb.checked));
  document.querySelectorAll('.multi-toggle').forEach(l => l.addEventListener('pointerdown', () => noDrag = true));
  bindDrag();

  if (editingId && $('eVendor')) {
    bindPhoneInput($('eContact'));
    ['eVendor','ePrice','eContact','eLink','eMemo'].forEach(id => $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') saveEdit();
      if (e.key === 'Escape') cancelEdit();
    }));
    (editingId === NEW_ID ? $('eVendor') : $('eMemo')).focus();
  }
}

['filterCat','filterStatus'].forEach(id => $(id).onchange = render);
$('search').oninput = render;

// ===================================================================
//  탭2: 살 것 메모
// ===================================================================
let shops = [];
let pendingShop = false, focusAddStore = null;

function migrateShop(d) {
  return toArr(d).filter(Boolean).map(s => ({
    id: String(s.id || newId()), name: s.name || '',
    items: toArr(s.items).filter(Boolean).map(t => ({ id: String(t.id || newId()), text: t.text || '', done: !!t.done }))
  }));
}
function shopTyping() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('#tab-shop') && a.tagName === 'INPUT' && a.type !== 'checkbox');
}
window.applyShop = data => {
  shops = migrateShop(data);
  if (shopTyping()) { pendingShop = true; return; }
  renderShop();
};
function persistShop(doRender = true) {
  if (doRender) renderShop();
  if (window.cloudSaveShop) window.cloudSaveShop(shops);
  else alert('아직 서버에 연결되지 않았어요. 잠시 후 다시 시도해 주세요.');
}
const findStore = sid => shops.find(s => s.id === sid);

function addStore() {
  const name = $('sName').value.trim();
  if (!name) { $('sName').focus(); return; }
  const dup = shops.find(s => s.name === name);
  if (dup) {
    toast(`'${name}'는 이미 있어요`);
    $('sName').value = '';
    const inp = document.querySelector(`[data-sid="${dup.id}"] [data-act="addin"]`);
    if (inp) { inp.focus(); inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    return;
  }
  const s = { id: newId(), name, items: [] };
  shops.push(s);
  $('sName').value = '';
  focusAddStore = s.id;
  persistShop();
}
function addShopItem(sid) {
  const s = findStore(sid); if (!s) return;
  const inp = document.querySelector(`[data-sid="${sid}"] [data-act="addin"]`);
  const texts = (inp ? inp.value : '').split(/[,，\n]/).map(t => t.trim()).filter(Boolean);
  if (!texts.length) { if (inp) inp.focus(); return; }
  texts.forEach(text => s.items.push({ id: newId(), text, done: false }));
  focusAddStore = sid;
  persistShop();
}
function moveStore(sid, dir) {
  const i = shops.findIndex(s => s.id === sid), j = i + dir;
  if (i < 0 || j < 0 || j >= shops.length) return;
  [shops[i], shops[j]] = [shops[j], shops[i]];
  persistShop();
}
function deleteStore(sid) {
  const s = findStore(sid); if (!s) return;
  if (!confirm(`'${s.name}'와 안에 적은 ${s.items.length}개를 모두 삭제할까요?`)) return;
  shops = shops.filter(x => x.id !== sid);
  persistShop();
}

function renderShop() {
  pendingShop = false;
  const left = shops.reduce((n, s) => n + s.items.filter(t => !t.done).length, 0);
  $('tabShopBtn').textContent = left ? `🛒 살 것 메모 (${left})` : '🛒 살 것 메모';

  if (!shops.length) {
    $('shopList').innerHTML = `<div class="card empty" style="grid-column:1/-1">아직 가게가 없어요. 위에서 "코스트코"처럼 추가해보세요!</div>`;
    return;
  }
  $('shopList').innerHTML = shops.map((s, si) => {
    const remain = s.items.filter(t => !t.done).length;
    const doneN = s.items.length - remain;
    const rows = s.items.length
      ? s.items.map(t => `<div class="shop-item ${t.done ? 'done' : ''}" data-tid="${t.id}">
          <input type="checkbox" data-act="done" ${t.done ? 'checked' : ''}>
          <input class="txt" data-act="text" value="${esc(t.text)}">
          <button class="x-btn" data-act="delitem" title="삭제">×</button></div>`).join('')
      : `<div class="shop-empty">아직 살 것이 없어요. 아래에 적어보세요.</div>`;
    return `<div class="card" data-sid="${s.id}">
      <div class="store-head">
        <span>🛒</span>
        <input class="store-name" data-act="rename" value="${esc(s.name)}" title="눌러서 이름 바꾸기">
        <span class="store-count">${remain}/${s.items.length}</span>
        <button class="btn-small btn-gray" data-act="up" ${si === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn-small btn-gray" data-act="down" ${si === shops.length - 1 ? 'disabled' : ''}>▼</button>
        <button class="btn-small btn-red" data-act="delstore">삭제</button>
      </div>
      ${rows}
      <div class="add-line">
        <input data-act="addin" placeholder="살 것 입력 후 Enter (쉼표로 여러 개)" enterkeyhint="done">
        <button class="btn-small btn-primary" data-act="additem">추가</button>
      </div>
      ${doneN ? `<button class="link-btn" data-act="cleardone">산 것 ${doneN}개 지우기</button>` : ''}
    </div>`;
  }).join('');

  if (focusAddStore) {
    const inp = document.querySelector(`[data-sid="${focusAddStore}"] [data-act="addin"]`);
    if (inp) inp.focus();
    focusAddStore = null;
  }
}

$('btnAddStore').onclick = addStore;
$('sName').addEventListener('keydown', e => { if (e.key === 'Enter') addStore(); });

const shopCtx = el => {
  const sid = el.closest('[data-sid]')?.dataset.sid, tid = el.closest('[data-tid]')?.dataset.tid;
  const s = findStore(sid);
  return { sid, tid, s, t: s && tid ? s.items.find(x => x.id === tid) : null };
};
$('shopList').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const { sid, tid, s } = shopCtx(b);
  switch (b.dataset.act) {
    case 'up': moveStore(sid, -1); break;
    case 'down': moveStore(sid, 1); break;
    case 'delstore': deleteStore(sid); break;
    case 'additem': addShopItem(sid); break;
    case 'delitem': if (s) { s.items = s.items.filter(x => x.id !== tid); persistShop(); } break;
    case 'cleardone': if (s) { s.items = s.items.filter(x => !x.done); persistShop(); } break;
  }
});
$('shopList').addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  const { s, t } = shopCtx(el);
  if (!s) return;
  if (act === 'done' && t) { t.done = el.checked; persistShop(); }
  if (act === 'text' && t) {
    const v = el.value.trim();
    if (!v) { s.items = s.items.filter(x => x !== t); persistShop(); }
    else { t.text = v; persistShop(false); }
  }
  if (act === 'rename') {
    const v = el.value.trim();
    if (!v) { el.value = s.name; return; }
    s.name = v; persistShop(false);
  }
});
$('shopList').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const act = e.target.dataset.act;
  if (act === 'addin') { e.preventDefault(); addShopItem(shopCtx(e.target).sid); }
  if (act === 'text' || act === 'rename') e.target.blur();
});
$('tab-shop').addEventListener('focusout', () => setTimeout(() => {
  if (pendingShop && !shopTyping()) renderShop();
}, 0));

// ===================================================================
//  내보내기 / 백업 (견적 + 살 것 메모 함께)
// ===================================================================
$('btnCsv').onclick = () => {
  const rows = [['구분','항목','후보','업체·제품','금액','렌탈(월)','연락처','링크','비고','선택']];
  groupItems(items).forEach((list, name) => list.forEach((it, idx) =>
    rows.push([it.cat, name, idx + 1, it.vendor, it.price, isRent(it) ? 'O' : '', it.contact, it.link, it.memo, it.selected ? 'O' : ''])));
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download('\uFEFF' + csv, '이사준비_견적비교.csv', 'text/csv;charset=utf-8');
};
$('btnBackup').onclick = () => download(JSON.stringify({ version: 2, items, shopping: shops }, null, 2),
  `이사준비_백업_${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
$('btnRestore').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const isOld = Array.isArray(data);
      const qItems = isOld ? data : data.items;
      if (!Array.isArray(qItems)) throw 0;
      const sh = isOld ? null : migrateShop(data.shopping);
      const msg = isOld
        ? `백업에서 견적 후보 ${qItems.length}개를 불러올까요?\n(살 것 메모는 그대로 두고, 견적만 덮어써요)`
        : `백업에서 견적 후보 ${qItems.length}개, 가게 ${sh.length}곳을 불러올까요?\n(지금 데이터는 덮어써지고, 상대방 화면에도 바로 반영돼요)`;
      if (!confirm(msg)) return;
      items = migrate(qItems); editingId = null; addingName = null; persist();
      if (sh) { shops = sh; persistShop(); }
    } catch { alert('백업 파일이 올바르지 않아요.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};
function download(content, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

let savedTab = 'quote';
try { savedTab = localStorage.getItem('moving-tab') || 'quote'; } catch {}
showTab(savedTab === 'shop' ? 'shop' : 'quote');
render();
renderShop();
</script>

const firebaseConfig = {

  projectId: "project-3104745963085627802",
  storageBucket: "project-3104745963085627802.firebasestorage.app",

const el = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const dataRef = ref(db, 'planner/items');
const shopRef = ref(db, 'planner/shopping');
let unsubs = [];

const showGate = msg => { el('gate').style.display = 'flex'; el('gateMsg').textContent = msg || ''; };
const setSync = t => el('syncState').textContent = t;
const saver = r => data => {
  setSync('저장 중…');
  set(r, data).then(() => setSync('✔ 저장됨')).catch(() => setSync('⚠ 저장 실패'));
};

if (location.protocol === 'file:') showGate('이 버전은 내 PC 파일로는 로그인이 안 돼요. GitHub Pages 주소로 열어주세요.');

el('btnLogin').onclick = () =>
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => showGate('로그인 실패: ' + e.code));
el('btnLogout').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(f => f()); unsubs = [];
  window.cloudSave = null; window.cloudSaveShop = null;
  if (!user) { showGate(''); return; }
  el('gateMsg').textContent = '불러오는 중…';

  unsubs.push(onValue(dataRef, snap => {
    el('gate').style.display = 'none';
    el('userEmail').textContent = user.email;
    window.cloudSave = saver(dataRef);
    setSync('✔ 동기화됨');
    window.applyRemote(snap.val());
  }, () => {
    showGate(`${user.email} 계정은 접근 권한이 없어요. 등록된 계정으로 로그인해 주세요.`);
    signOut(auth);
  }));

  unsubs.push(onValue(shopRef, snap => {
    window.cloudSaveShop = saver(shopRef);
    window.applyShop(snap.val());
  }, () => {}));
});
</script>
